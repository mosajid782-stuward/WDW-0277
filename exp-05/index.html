<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <header>
    <h1 align="center">Student Registration Form</h1>
    <hr>
    </header>
    <main>
        <!--Name-->
        <form action="#" method="post">
            <lebel for="fullname">Full Name:</lebel>
            <input type="text" placeholder="Enter your full name" id="fullname" name="fullname" required>
            <br><br>
            <!--Email with validation-->
            <lebel for="email">Email:</lebel>
            <input type="email" placeholder="Enter valid email address" id="email" name="email" required>
            <br><br>
            <!--Password-->
            <lebel for="password">Password:</lebel>
            <input type="password" placeholder="Enter your password" id="password" name="password" required>
            <br><br>
            <!--Gender Choice-->
            <lebel for="gender">Gender:</lebel>
            <input type="radio" name="gender" value="male" required>Male
            <input type="radio" name="gender" value="female" required>Female
            <input type="radio" name="gender" value="other" required>Other
            <br><br>
            <!--Course Selection-->
            <lebel for="course">Course:</lebel>
            <select id="course" name="course" required>
                <option value="">Select Course</option>
                <option value="btech">B.Tech</option>
                <option value="bca">BCA</option>
                <option value="mba">MBA</option>
                <option value="mca">MCA</option>
            </select>
            <br><br>
            <!--Contact Number-->
            <lebel for="phone">Contact No:</lebel>
            <input type="tel" id="phone" name="phone" placeholder="Enter phone Number" maxlength="10" required>
            <br><br>
            <!--Address-->
            <lebel for="address">Address:</lebel>
            <textarea name="address" id="address" placeholder="Enter your Address" row="4" col="40" required>
            </textarea>
            <br><br>
            <!--Submit & Reset -->
            <input type="submit" value="register">
            <input type="reset" value="clear">
        </form>
        <hr>
        <footer>
            <p align="center">&copy; 2026 Registration Portal</p>
        </footer>
    </main>

</body>
</html>
