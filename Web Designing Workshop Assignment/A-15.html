<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignment-15</title>
</head>
<body>
    <h4>Personal Details..</h4>
    <form action="#" method="post">
        <!--Name box-->
        <lebel for="fullname">Name:</lebel>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your Name" required>
        <br><br>
        <!--Email box-->
        <lebel for="email">Email:</lebel>
        <input type="email" id="email" name="email" placeholder="Enter valid Email address" required>
        <br><br>
        <!--Password box-->
        <lebel for="password">Password:</lebel>
        <input type="Password" id="password" name="password" placeholder="Enter Password" required>
        <br><br>
        <!--Gender box-->
        <lebel for="gender">Gender:</lebel>
        <input type="radio" name="gender" value="male" required>Male
        <input type="radio" name="gender" value="female" required>Female
        <input type="radio" name="gender" value="other" required>Other
        <br><br>
        <!--Check box-->
        <lebel for="hobbies">Hobbies:</lebel>
        <input type="checkbox" name="hobbies" value="reading">Reading
        <input type="checkbox" name="hobbies" value="coding">Coding
        <br><br>
        <!--DOB box-->
        <lebel for="dob">DOB:</lebel>
        <input type="date" name="dob" required>
    </form>
</body>
</html>
