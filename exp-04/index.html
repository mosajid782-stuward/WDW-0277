<!DOCTYPE html>
<html>
    <head>
        <title> HOTEL BOOKING FORM</title>
    </head>
    <body>
        <h1 align="center">Hotel Room Booking Form</h1>
        <form align="center" action="#"method="post" align="center">
            <!--NAME-->
            <lebel for="fullname">Full Name:</lebel>
            <input type="text" id="fullname" name="fullname" required>
            <br><br>
            <!--Email-->
            <lebel for="email">Email:</lebel>
            <input type="email" id="email" name="email" required>
            <br><br>
            <!--Phone-->
            <lebel for="phone">Phone:</lebel>
            <input type="tel" id="phone" name="phone" required>
            <br><br>
            <!--check-in & check-out-->
            <lebel for="checkin">Check-in Date:</lebel>
            <input type="date" id="checkin" name="checkin" required>
            <br><br>
            <lebel for="checkout">Check-out:</lebel>
            <input type="date" id="checkout" name="checkout" required>
            <br><br>
            <!--Room Type-->
            <lebel for="room">Room Type:</lebel>
            <select id="room" name="room">
                <option value="single">Single Room</option>
                <option value="double">Double Room</option>
                <option value="deluxe">Deluxe Room</option>
                <option value="suite">suite</option>
            </select>
            <br><br>
            <!--NUmber of Guest-->
            <lebel for="guests">Number of Guests:</lebel>
            <input type="number" id="guests" name="guests" min="1" max="10">
            <br><br>
        </form>
    </body>
</html>
